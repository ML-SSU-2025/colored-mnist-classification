# Background Color Classification Task 최적 설정
# Task: 7-way classification (ROYGBIV)
# 중간보고서 기준 - 로지스틱 회귀 제거, 앙상블 제거

experiment:
  name: "bg_color_classification"
  task: "bg"
  description: "Background color classification (7 classes, ROYG BIV)"

# 사용할 모델 목록 (로지스틱 회귀 제거)
active_models:
  - knn
  - svm
  - tree
  - rf
  - xgb

# 모델별 최적 하이퍼파라미터는 models.yaml의 task별 설정 사용
# 필요시 여기서 오버라이드 가능

# GridSearch 사용 여부 (모두 false - 보고서 최적값 사용)
use_gridsearch:
  knn: false
  svm: false
  tree: false
  rf: false
  xgb: false

# 평가 설정
evaluation:
  cv: 3
  scoring: "accuracy"
  save_results: true
  save_figures: true
