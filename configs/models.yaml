# 모델별 하이퍼파라미터 정의 (최종 버전 - 2025-12-17)
# Task별 하이퍼파라미터 구조: 각 모델에 digit, fg, bg 별도 설정 가능
# 앙상블 및 로지스틱 회귀 제거

models:
  knn:
    # Digit: PCA 적용 시 97.93% (n_neighbors=7, p=1)
    # FG: 색상 분류 - Euclidean 거리(p=2)가 RGB에 더 적합
    # BG: 색상 분류 - Euclidean 거리(p=2) 사용
    digit:
      n_neighbors: 5
      p: 2  # Manhattan distance - 형태 분류에 효과적
      metric: "minkowski"
      weights: "distance"
      use_pca: true  # Digit Task에서 PCA 적용 (97.93%)
      pca_n_components: 0.95  # 99% 분산 유지
    fg:
      # 색상 분류 최적화: Euclidean 거리 + 더 많은 이웃
      n_neighbors: 7  # 색상 분류에는 더 적은 이웃이 효과적일 수 있음
      p: 1  # Euclidean distance - RGB 색상 공간에 더 적합
      metric: "minkowski"
      weights: "distance"
      use_pca: false
    bg:
      # 색상 분류 최적화: Euclidean 거리
      n_neighbors: 5
      p: 2  # Euclidean distance - RGB 색상 공간에 더 적합
      metric: "minkowski"
      weights: "uniform"
      use_pca: false
    needs_scaling: true

  svm:
    # 최신 하이퍼파라미터: C=40.0, gamma=0.002
    digit:
      decision_function_shape: "ovr"
      gamma: 0.002
      C: 40.0
    fg:
      decision_function_shape: "ovr"
      gamma: 0.002
      C: 40.0
    bg:
      decision_function_shape: "ovr"
      gamma: 0.002
      C: 40.0
    needs_scaling: true

  tree:
    # GridSearch 최적값: criterion=entropy, max_depth=None, min_samples_split=2, min_samples_leaf=1
    # 성능: digit 77.12%, fg 99.28%, bg 100%
    digit:
      criterion: "entropy"
      max_depth: null
      min_samples_split: 2
      min_samples_leaf: 1
    fg:
      criterion: "entropy"
      max_depth: null
      min_samples_split: 2
      min_samples_leaf: 1
    bg:
      criterion: "entropy"
      max_depth: null
      min_samples_split: 2
      min_samples_leaf: 1
    needs_scaling: false

  rf:
    # n_estimators 실험 결과: 1200이 최적 (digit 93.46%)
    # FG/BG는 300으로도 100% 달성
    digit:
      n_estimators: 1200  # 최적값
      criterion: "entropy"
      max_depth: null
      min_samples_split: 2
      min_samples_leaf: 1
      n_jobs: -1
    fg:
      n_estimators: 300  # FG는 300으로 충분 (100%)
      criterion: "entropy"
      max_depth: null
      min_samples_split: 2
      min_samples_leaf: 1
      n_jobs: -1
    bg:
      n_estimators: 300  # BG는 300으로 충분 (100%)
      criterion: "entropy"
      max_depth: null
      min_samples_split: 2
      min_samples_leaf: 1
      n_jobs: -1
    needs_scaling: false

  xgb:
    # Optuna/GridSearch 최적화된 하이퍼파라미터
    # 성능: digit 95.09%, fg/bg 100%
    digit:
      n_estimators: 500
      gamma: 0.0009962296341735864
      reg_alpha: 0.09229476309669135
      reg_lambda: 1.489653340940698
      learning_rate: 0.19105772237896215
      max_depth: 5
      subsample: 0.9677210874590798
      colsample_bytree: 0.991985803516291
      eval_metric: "mlogloss"
      n_jobs: -1
    fg:
      n_estimators: 500
      gamma: 0.0009962296341735864
      reg_alpha: 0.09229476309669135
      reg_lambda: 1.489653340940698
      learning_rate: 0.19105772237896215
      max_depth: 5
      subsample: 0.9677210874590798
      colsample_bytree: 0.991985803516291
      eval_metric: "mlogloss"
      n_jobs: -1
    bg:
      n_estimators: 500
      gamma: 0.0009962296341735864
      reg_alpha: 0.09229476309669135
      reg_lambda: 1.489653340940698
      learning_rate: 0.19105772237896215
      max_depth: 5
      subsample: 0.9677210874590798
      colsample_bytree: 0.991985803516291
      eval_metric: "mlogloss"
      n_jobs: -1
    needs_scaling: false

# GridSearch 사용 여부 (모두 false - 최적값 사용)
use_gridsearch:
  knn: false
  svm: false
  tree: false
  rf: false
  xgb: false
